name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Acceptance fixtures and game tests
        run: npm test
      - name: Production build (no pack)
        run: node tools/build.mjs --no-pack
      - name: Atlas is reproducible from source
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          node tools/bake-atlas.mjs
          git diff --exit-code -- assets/atlas
