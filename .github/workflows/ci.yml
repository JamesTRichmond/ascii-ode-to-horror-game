name: CI
on:
  pull_request:
  push: # every branch, main included; CI never deploys
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies (test tooling only; the game ships none)
        run: npm ci --ignore-scripts
      - name: Acceptance fixtures and game tests
        run: npm test
      - name: Production build (no pack)
        run: node tools/build.mjs --no-pack
      - name: Atlas is reproducible from source
        env:
          # sha256 of the DejaVuSansMono.ttf the committed atlas was baked from (fonts-dejavu-core 2.37-8)
          ATLAS_FONT_SHA256: c805f9436dbc268644c1d9584f01a601a653e028e08fd74b9b949f6cf8304d88
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          font=/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
          if [ "$(sha256sum "$font" | cut -d' ' -f1)" != "$ATLAS_FONT_SHA256" ]; then
            echo "::warning::runner font differs from the one the atlas was baked from; reproducibility check skipped"
            exit 0
          fi
          node tools/bake-atlas.mjs "$font"
          git diff --exit-code -- assets/atlas
