# Release pipeline. Runs only for version tags (v*) or a manual dispatch; nothing deploys on a push to a branch.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy dist/ to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node tools/build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ode-release
          path: release/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/
  github-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') # a manual run on an existing tag must not recreate its release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ode-release
          path: release/
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""; case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/* --draft $prerelease --title "ODE $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
  pages:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
