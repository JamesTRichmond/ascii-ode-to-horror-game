# Release pipeline. Runs only for version tags (v*) or a manual dispatch; nothing deploys on a push to a branch.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy dist/ to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ode-release
          path: release/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ode-release
          path: release/
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""; case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/* --draft $prerelease --title "ODE $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
  pages:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
